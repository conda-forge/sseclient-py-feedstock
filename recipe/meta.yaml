{% set name = "sseclient-py" %}
{% set version = "1.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # 1.9.0 was published to PyPI as a wheel only, so build from the GitHub tag
  url: https://github.com/mpetazzoni/sseclient/archive/refs/tags/sseclient-py-{{ version }}.tar.gz
  sha256: 467b6abcc5833e17195c0be6a18f599cb2a3a784f5ec16d539e5d1d6273d3745

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - sseclient
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mpetazzoni/sseclient
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python client for SSE event sources that seamlessly integrates with urllib3 and requests.


extra:
  recipe-maintainers:
    - sanurielf
    - mpetazzoni
